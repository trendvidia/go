# Cross-platform plugin validation matrix (ROADMAP A3, issue #4).
#
# Replaces the manual over-SSH sweep with CI on self-hosted runners, one
# per platform. Each runner carries a custom label equal to its machine
# name; the matrix targets [self-hosted, <machine>]:
#
#   darwin/arm64   -> mini
#   linux/amd64    -> maclin
#   linux/arm64    -> linux_parallels
#   windows/amd64  -> windows_omen
#   windows/arm64  -> windows_parallels
#
# Each leg builds the toolchain from source and runs the plugin-relevant
# test packages, catching cross-platform plugin regressions at PR time.
name: plugin-matrix

on:
  push:
    branches: [trendvidia]
  pull_request:
    branches: [trendvidia]
  workflow_dispatch:

# Supersede in-flight runs for the same ref; a full make.bash per leg is
# expensive, so don't stack them.
concurrency:
  group: plugin-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin/arm64
            runner: mini
          - platform: linux/amd64
            runner: maclin
          - platform: linux/arm64
            runner: linux_parallels
          - platform: windows/amd64
            runner: windows_omen
          - platform: windows/arm64
            runner: windows_parallels
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # trendvidia/go#81: give every run a cold, private build cache.
      #
      # This fork's VERSION is release-style (go1.26.5), so cmd/go keys
      # the build cache on the compiler's version STRING alone --
      # upstream's assumption that a released toolchain never changes.
      # Here the compiler and linker change on every commit while the
      # string does not, so a persistent GOCACHE on a self-hosted runner
      # can serve std package archives built by a PREVIOUS commit's
      # toolchain, and a change to compiler or linker output for std --
      # exactly the work this repo is made of -- gets judged green
      # against objects it never produced. `-count=1` does not help: it
      # defeats test-result caching, not the package cache.
      #
      # A private directory per run rather than `go clean -cache` on the
      # shared one: these runners host several jobs each, and wiping a
      # shared cache mid-run has been observed pruning a concurrent
      # job's entries out from under it.
      #
      # Set here rather than in a job-level `env:` because the value
      # needs RUNNER_TEMP, and the `runner` context is not available to
      # `jobs.<id>.env` -- a workflow that tries is rejected outright,
      # with zero jobs scheduled.
      #
      # The cold start is asserted, not assumed: the done-when accepts
      # "provably starts from an empty GOCACHE", and a guarantee nothing
      # checks is one that quietly stops holding.
      - name: Use a cold, per-run build cache (Unix)
        if: runner.os != 'Windows'
        run: |
          cache="$RUNNER_TEMP/gocache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -e "$cache" ]; then
            echo "::error::$cache already exists: this run is not starting cold (trendvidia/go#81)"
            exit 1
          fi
          echo "cold: $cache does not exist yet"
          echo "GOCACHE=$cache" >> "$GITHUB_ENV"

      - name: Use a cold, per-run build cache (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "cache=%RUNNER_TEMP%\gocache-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          if exist "%cache%" echo ::error::%cache% already exists - this run is not starting cold, see trendvidia/go#81
          if exist "%cache%" exit /b 1
          echo cold: %cache% does not exist yet
          echo GOCACHE=%cache%>>"%GITHUB_ENV%"

      # --- Unix (darwin, linux) ---
      - name: Build toolchain
        if: runner.os != 'Windows'
        working-directory: src
        run: |
          export GOROOT_BOOTSTRAP="$(go env GOROOT)"
          ./make.bash

      # Both POSIX plugin suites skip WHOLESALE when cgo is unavailable --
      # cmd/cgo/internal/testplugin/plugin_test.go and
      # cmd/internal/testplugin/plugin_test.go both set globalSkip on
      # `!testenv.HasCGO() && runtime.GOOS != "windows"` -- and a run that
      # skips everything still reports success. With dist-test's linux/amd64
      # row removed (#87/#88) this leg is the only automated linux/amd64
      # signal left, so assert the precondition instead of trusting a green
      # tick that a missing C compiler would produce just as readily.
      - name: Assert cgo is available (Unix)
        if: runner.os != 'Windows'
        run: |
          cgo=$(./bin/go env CGO_ENABLED)
          [ "$cgo" = 1 ] || { echo "::error::CGO_ENABLED=$cgo: the POSIX plugin suites would skip entirely, so this leg would pass without testing anything"; exit 1; }

      # internal/buildcfg is in the list for the reason dist-test.yml gives at
      # its Windows lane: the build above deliberately does NOT unset
      # CGO_ENABLED, so TestDefaultCGOEnabledUnset (#9, #54) DETECTS a runner
      # whose service environment exports it. The Unix legs used to get that
      # pin from all.bash in dist-test; linux/amd64 no longer runs all.bash
      # anywhere (#87/#88), which left `maclin` with no execution of it at all.
      - name: Plugin validation
        if: runner.os != 'Windows'
        run: |
          ./bin/go test -count=1 \
            plugin \
            cmd/link/internal/ld \
            cmd/cgo/internal/testplugin \
            cmd/internal/testplugin \
            internal/buildcfg

      # --- Windows (amd64, arm64) ---
      - name: Build toolchain (Windows)
        if: runner.os == 'Windows'
        working-directory: src
        shell: cmd
        run: |
          for /f "delims=" %%i in ('go env GOROOT') do set "GOROOT_BOOTSTRAP=%%i"
          call make.bat

      - name: Plugin validation (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: bin\go test -count=1 plugin cmd/link/internal/ld cmd/cgo/internal/testplugin cmd/internal/testplugin

      # Drop this run's cache whatever the outcome, so per-run
      # directories do not accumulate on the runners' disks (#81).
      - name: Remove this run's build cache (Unix)
        if: always() && runner.os != 'Windows'
        run: test -n "$GOCACHE" && rm -rf "$GOCACHE" || true

      - name: Remove this run's build cache (Windows)
        if: always() && runner.os == 'Windows'
        shell: cmd
        run: if exist "%GOCACHE%" rmdir /s /q "%GOCACHE%"
