name: dist-test

# Per-platform validation of the fork, built FROM SOURCE on each self-hosted box
# (bootstrapped by the box's own installed go-plus, GOROOT_BOOTSTRAP=$(go env GOROOT)).
#
# darwin/arm64 + linux/arm64: the FULL Go dist test (src/all.bash) — the
# rigorous check that the toolchain, runtime and whole stdlib are correct.
#
# linux/amd64 ran all.bash here too until its host was lost (#87) and the
# replacement turned out to SIGILL in it (#88). That row is REMOVED, not
# repointed, so no leg below runs all.bash on amd64 — the matrix comment
# where the row used to be states the gap and the condition for restoring it.
#
# windows/{amd64,arm64}: build (make.bat) + a core-stdlib smoke, NOT full all.bat.
# The full Windows dist test fails on OS-integration corners that self-hosted
# workgroup/VM Windows boxes don't satisfy (symlink privilege, workgroup
# NETWORK-SERVICE account resolution) — environmental, not fork defects; see #16.
# The fork's Windows-specific feature (plugin load/unload) is validated on all 5
# platforms by plugin-matrix.yml, so here Windows proves it BUILDS + runs core code.
#
# Runner labels match release-binaries.yml / plugin-matrix.yml (per-machine labels).

on:
  push:
    branches: [trendvidia]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly 06:00 UTC sweep across every box in the matrix below
    # (four while linux/amd64's row is out — #87/#88).
    - cron: '0 6 * * *'

# A full all.bash per Unix leg is expensive; supersede in-flight runs for the ref.
concurrency:
  group: dist-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dist-test:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: mini, goos: darwin, goarch: arm64 }
          # TEMPORARY (trendvidia/go#87): linux/amd64 all.bash has no host.
          # `trader` is throttled by its provider: a 9.3-minute run completed
          # 2026-08-27 14:32 and nothing has completed since; the 18:01 run was
          # killed at the 120-minute timeout. `maclin`, the replacement, cannot
          # run this leg either -- all.bash SIGILLs there because the 128-bit
          # simd compare tests are unguarded while their helper needs AVX2, and
          # that CPU is pre-Haswell (trendvidia/go#88).
          #
          # Removed rather than left red, so PRs gate on checks that can pass.
          # THE COVERAGE IS GONE, NOT RELOCATED: linux/arm64 still runs
          # all.bash so Linux-generic behaviour is covered, and plugin-matrix
          # still exercises linux/amd64 -- but amd64-specific all.bash coverage
          # is absent until this row comes back.
          #
          # RESTORE when #87 (hardware) or #88 (the simd guard) resolves.
          # Both issues name this line.
          - { runner: linux_parallels, goos: linux, goarch: arm64 }
          - { runner: windows_omen, goos: windows, goarch: amd64 }
          - { runner: windows_parallels, goos: windows, goarch: arm64 }
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # Unix: full dist test (make.bash + the complete test run).
      - name: all.bash (Unix)
        if: runner.os != 'Windows'
        working-directory: src
        run: |
          export GOROOT_BOOTSTRAP="$(go env GOROOT)"
          ./all.bash

      # Windows: build the toolchain, then smoke-test a curated set of PURE core
      # stdlib packages with the freshly-built go (compile + link + run + test).
      # The list deliberately excludes packages whose tests need external tools
      # or specific OS config (#16): os/user (workgroup account resolution), os
      # (symlink privilege), and runtime (its runtime-gdb tests fail on an
      # incompatible mingw gdb). make.bat already validates the runtime compiles;
      # plugin-matrix.yml validates the fork's plugin runtime feature on all 5.
      #
      # internal/buildcfg is in the list on purpose: the Windows leg does not run
      # all.bat, so its TestDefaultCGOEnabledUnset pin (#9) would otherwise never
      # execute on windows/{amd64,arm64}, even though make.bat bakes
      # DefaultCGO_ENABLED from %CGO_ENABLED% exactly as make.bash does. Note the
      # build below deliberately does NOT unset CGO_ENABLED: this lane exists to
      # DETECT a runner whose environment exports it, the same way the Unix legs
      # do via all.bash. (release-binaries.yml unsets it instead -- there the goal
      # is a correct artifact, not detection.)
      - name: make.bat + core-stdlib smoke (Windows)
        if: runner.os == 'Windows'
        working-directory: src
        shell: cmd
        run: |
          for /f "delims=" %%i in ('go env GOROOT') do set "GOROOT_BOOTSTRAP=%%i"
          call make.bat || exit /b 1
          ..\bin\go.exe test -short -count=1 errors fmt strings strconv bytes sort math encoding/json regexp sync context internal/buildcfg || exit /b 1

      # Confirm the toolchain we just built is the fork, not stock Go.
      - name: Assert the built toolchain is go-plus (Unix)
        if: runner.os != 'Windows'
        working-directory: src
        run: |
          ../bin/go version
          ../bin/go version | grep -q '(plus' || { echo "::error::built toolchain is not the go-plus fork"; exit 1; }
      - name: Assert the built toolchain is go-plus (Windows)
        if: runner.os == 'Windows'
        working-directory: src
        shell: powershell
        run: |
          ..\bin\go.exe version
          if (-not (..\bin\go.exe version | Select-String '\(plus')) { Write-Error 'built toolchain is not the go-plus fork'; exit 1 }
