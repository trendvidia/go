name: dist-test

# Full Go dist test (src/all.bash) on all five self-hosted go-plus platforms.
# Each leg builds the fork FROM SOURCE — bootstrapped by the box's own installed
# go-plus (GOROOT_BOOTSTRAP=$(go env GOROOT)) — and then runs the COMPLETE Go
# standard test suite via all.bash/all.bat. This is the definitive per-platform
# validation of the fork: a change that breaks the toolchain or a stdlib/runtime
# test on any target fails here. Heavy (~30-60 min/leg), so it also runs nightly.
#
# Runner labels match release-binaries.yml / plugin-matrix.yml (per-machine
# custom labels). all.bash/all.bat skip configs Go doesn't support (e.g. the
# race detector on windows/arm64), so no per-leg gating is needed here.

on:
  push:
    branches: [trendvidia]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly 06:00 UTC full dist-test sweep across all five boxes.
    - cron: '0 6 * * *'

# A full all.bash per leg is expensive; supersede in-flight runs for the ref.
concurrency:
  group: dist-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dist-test:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: mini, goos: darwin, goarch: arm64 }
          - { runner: trader, goos: linux, goarch: amd64 }
          - { runner: linux_parallels, goos: linux, goarch: arm64 }
          - { runner: windows_omen, goos: windows, goarch: amd64 }
          - { runner: windows_parallels, goos: windows, goarch: arm64 }
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Build the fork + run the whole dist test suite. GOROOT_BOOTSTRAP is the
      # box's installed go-plus (Go self-hosts; a 1.26 build bootstraps fine
      # from 1.26). all.bash does make.bash + the full test run.
      - name: all.bash (Unix)
        if: runner.os != 'Windows'
        working-directory: src
        run: |
          export GOROOT_BOOTSTRAP="$(go env GOROOT)"
          ./all.bash
      - name: all.bat (Windows)
        if: runner.os == 'Windows'
        working-directory: src
        shell: cmd
        run: |
          for /f "delims=" %%i in ('go env GOROOT') do set "GOROOT_BOOTSTRAP=%%i"
          call all.bat

      # Confirm the toolchain we just built is the fork, not stock Go.
      - name: Assert the built toolchain is go-plus (Unix)
        if: runner.os != 'Windows'
        working-directory: src
        run: |
          ../bin/go version
          ../bin/go version | grep -q '(plus)' || { echo "::error::built toolchain is not the go-plus fork"; exit 1; }
      - name: Assert the built toolchain is go-plus (Windows)
        if: runner.os == 'Windows'
        working-directory: src
        shell: powershell
        run: |
          ..\bin\go.exe version
          if (-not (..\bin\go.exe version | Select-String '\(plus\)')) { Write-Error 'built toolchain is not the go-plus fork'; exit 1 }
