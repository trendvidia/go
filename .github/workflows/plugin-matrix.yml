# Cross-platform plugin validation matrix (trendvidia/go-archive#4).
#
# One GitHub-hosted runner per platform:
#
#   darwin/arm64   -> macos-15
#   linux/amd64    -> ubuntu-24.04
#   linux/arm64    -> ubuntu-24.04-arm
#   windows/amd64  -> windows-2025
#   windows/arm64  -> windows-11-arm
#
# Hosted x64 machines all have AVX2, so no leg covers an AVX-only CPU;
# that path is checked by hand on such a machine.
#
# Each leg builds the toolchain from source and runs the plugin-relevant
# test packages, catching cross-platform plugin regressions at PR time.
name: plugin-matrix

on:
  push:
    branches: [trendvidia]
  pull_request:
    branches: [trendvidia]
  workflow_dispatch:

# Supersede in-flight runs for the same ref; a full make.bash per leg is
# expensive, so don't stack them.
concurrency:
  group: plugin-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # The workflow name is in the job name because branch protection
    # matches required checks by job name alone, and dist-test's legs are
    # named after the same platforms.
    name: plugin-matrix ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin/arm64
            runner: macos-15
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: windows/amd64
            runner: windows-2025
          - platform: windows/arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Hosted images have no go-plus to bootstrap from; any Go >= 1.24.6
      # will do (src/cmd/dist/notgo124.go). Its cache is off: the cold
      # GOCACHE below is the point.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      # windows/arm64 images put an x64 mingw gcc first on PATH, which cannot
      # assemble arm64 (runtime/cgo's gcc_arm64.S fails in make.bat). Use
      # MSYS2's clangarm64 toolchain, which targets arm64 Windows and is what
      # the self-hosted arm64 box used.
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        with:
          msystem: CLANGARM64
          update: false
          install: mingw-w64-clang-aarch64-clang
      - name: Use clangarm64 for cgo (Windows arm64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\clangarm64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "CC=clang" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # trendvidia/go#20: give every run a cold, private build cache.
      #
      # Until #20, cmd/go keyed the build cache of a release-style VERSION
      # on the compiler's version STRING alone -- upstream's assumption
      # that a released toolchain never changes. Here the compiler and
      # linker change on every commit while the string does not, so a
      # persistent GOCACHE could serve std package archives built by a
      # PREVIOUS commit's toolchain, and a change to compiler or linker
      # output for std got judged green against objects it never
      # produced. The fork now keys on the tools' content IDs, which
      # closes that. The per-run cache stays so that a regression of
      # #20 cannot turn into a false green here. It does not detect one:
      # the cmd/go script test build_toolid_contentid does, with
      # cmd/internal/objabi's TestVersionFlagBuildID. dist-test runs both
      # on every leg: through all.bash on Unix, by name on Windows.
      #
      # A private directory per run rather than `go clean -cache` on a
      # shared one: on the self-hosted runners this repo used until
      # 2026-10-12, each hosting several jobs, a shared wipe was observed
      # pruning a concurrent job's entries out from under it.
      #
      # Set here rather than in a job-level `env:` because the value
      # needs RUNNER_TEMP, and the `runner` context is not available to
      # `jobs.<id>.env` -- a workflow that tries is rejected outright,
      # with zero jobs scheduled.
      #
      # The cold start is asserted, not assumed: the done-when accepts
      # "provably starts from an empty GOCACHE", and a guarantee nothing
      # checks is one that quietly stops holding.
      - name: Use a cold, per-run build cache (Unix)
        if: runner.os != 'Windows'
        run: |
          cache="$RUNNER_TEMP/gocache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -e "$cache" ]; then
            echo "::error::$cache already exists: this run is not starting cold (trendvidia/go#20)"
            exit 1
          fi
          echo "cold: $cache does not exist yet"
          echo "GOCACHE=$cache" >> "$GITHUB_ENV"

      - name: Use a cold, per-run build cache (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "cache=%RUNNER_TEMP%\gocache-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          if exist "%cache%" echo ::error::%cache% already exists - this run is not starting cold, see trendvidia/go#20
          if exist "%cache%" exit /b 1
          echo cold: %cache% does not exist yet
          echo GOCACHE=%cache%>>"%GITHUB_ENV%"

      # --- Unix (darwin, linux) ---
      - name: Build toolchain
        if: runner.os != 'Windows'
        working-directory: src
        run: |
          GOROOT_BOOTSTRAP="$(go env GOROOT)"
          export GOROOT_BOOTSTRAP
          ./make.bash

      # Both POSIX plugin suites skip WHOLESALE when cgo is unavailable --
      # cmd/cgo/internal/testplugin/plugin_test.go and
      # cmd/internal/testplugin/plugin_test.go both set globalSkip on
      # `!testenv.HasCGO() && runtime.GOOS != "windows"` -- and a run that
      # skips everything still reports success. So assert the precondition
      # instead of trusting a green tick that a missing C compiler would
      # produce just as readily.
      - name: Assert cgo is available (Unix)
        if: runner.os != 'Windows'
        run: |
          cgo=$(./bin/go env CGO_ENABLED)
          [ "$cgo" = 1 ] || { echo "::error::CGO_ENABLED=$cgo: the POSIX plugin suites would skip entirely, so this leg would pass without testing anything"; exit 1; }

      # internal/buildcfg is in the list for the reason dist-test.yml gives at
      # its Windows lane: the build above deliberately does NOT unset
      # CGO_ENABLED, so TestDefaultCGOEnabledUnset (trendvidia/go-archive#9)
      # DETECTS a runner whose environment exports it.
      - name: Plugin validation
        if: runner.os != 'Windows'
        run: |
          ./bin/go test -count=1 \
            plugin \
            cmd/link/internal/ld \
            cmd/cgo/internal/testplugin \
            cmd/internal/testplugin \
            internal/buildcfg

      # --- Windows (amd64, arm64) ---
      - name: Build toolchain (Windows)
        if: runner.os == 'Windows'
        working-directory: src
        shell: cmd
        run: |
          for /f "delims=" %%i in ('go env GOROOT') do set "GOROOT_BOOTSTRAP=%%i"
          call make.bat

      # The cgo fixtures need a C compiler. Print which one this image
      # provides, so a leg that silently runs without cgo is visible.
      - name: C toolchain (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          bin\go env CGO_ENABLED CC
          where gcc clang 2>nul || echo no gcc or clang on PATH

      - name: Plugin validation (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: bin\go test -count=1 plugin cmd/link/internal/ld cmd/cgo/internal/testplugin cmd/internal/testplugin

      # Drop this run's cache whatever the outcome, so per-run
      # directories do not accumulate on the runners' disks (trendvidia/go#20).
      - name: Remove this run's build cache (Unix)
        if: always() && runner.os != 'Windows'
        run: test -n "$GOCACHE" && rm -rf "$GOCACHE" || true

      - name: Remove this run's build cache (Windows)
        if: always() && runner.os == 'Windows'
        shell: cmd
        run: if exist "%GOCACHE%" rmdir /s /q "%GOCACHE%"
