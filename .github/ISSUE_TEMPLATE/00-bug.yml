name: Bug
description: A problem with the go-plus fork, such as plugins, Close, or the toolchain
title: "pkg/path: short description"

body:
  - type: markdown
    attributes:
      value: |
        This tracker is for the go-plus fork. If the bug also happens with stock Go of the same version, please report it at https://github.com/golang/go/issues instead. `go bug` opens this form with your environment filled in.

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: The output of `go version`. For this fork it ends in `(plus <release>)`.
      placeholder: go version go1.27.3 windows/amd64 (plus v1.27.3c)
    validations:
      required: true

  - type: dropdown
    id: stock-go
    attributes:
      label: Does it happen with stock Go of the same version?
      options:
        - "No, only with go-plus"
        - "Not applicable: uses a fork-only feature (Windows plugins, Close)"
        - "Not checked"
    validations:
      required: true

  - type: textarea
    id: go-env
    attributes:
      label: "Output of `go env`"
      render: shell
    validations:
      required: true

  - type: textarea
    id: what-did-you-do
    attributes:
      label: What did you do?
      description: A small program that shows the problem, and the commands that build the host and any plugins.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: What did you see happen?
      description: Include error messages and panics in full.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to see?
    validations:
      required: true
