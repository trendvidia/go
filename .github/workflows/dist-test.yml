name: dist-test

# Per-platform validation of the fork, built FROM SOURCE on a GitHub-hosted
# runner per platform, bootstrapped from stock Go installed by setup-go.
#
# darwin/arm64, linux/arm64, linux/amd64: the FULL Go dist test (src/all.bash)
# — the rigorous check that the toolchain, runtime and whole stdlib are correct.
#
# windows/{amd64,arm64}: build (make.bat) + a core-stdlib smoke, NOT full all.bat.
# The full Windows dist test failed on OS-integration corners of the
# self-hosted boxes this ran on before (symlink privilege, workgroup
# NETWORK-SERVICE account resolution; trendvidia/go-archive#16) — environmental, not
# fork defects.
# The fork's Windows-specific feature (plugin load/unload) is validated on all 5
# platforms by plugin-matrix.yml, so here Windows proves it BUILDS + runs core code.
#
# Runner labels match release-binaries.yml and plugin-matrix.yml.

on:
  push:
    branches: [trendvidia]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly 06:00 UTC sweep across every leg in the matrix below.
    - cron: '0 6 * * *'

# A full all.bash per Unix leg is expensive; supersede in-flight runs for the ref.
concurrency:
  group: dist-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dist-test:
    # The workflow name is in the job name because branch protection
    # matches required checks by job name alone, and plugin-matrix's legs
    # are named after the same platforms.
    name: dist-test ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted, one per platform. Hosted x64 machines all have
          # AVX2, so no leg covers an AVX-only CPU (where trendvidia/go-archive#88
          # was found); that path is checked by hand on such a machine.
          - { runs-on: macos-15, goos: darwin, goarch: arm64 }
          - { runs-on: ubuntu-24.04, goos: linux, goarch: amd64 }
          - { runs-on: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { runs-on: windows-2025, goos: windows, goarch: amd64 }
          - { runs-on: windows-11-arm, goos: windows, goarch: arm64 }
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # Hosted images have no go-plus to bootstrap from; any Go >= 1.24.6
      # will do (src/cmd/dist/notgo124.go). Its own cache is off: the cold
      # GOCACHE below is the point of this workflow.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      # windows/arm64 images put an x64 mingw gcc first on PATH, which cannot
      # assemble arm64 (runtime/cgo's gcc_arm64.S fails in make.bat). Use
      # MSYS2's clangarm64 toolchain, which targets arm64 Windows and is what
      # the self-hosted arm64 box used.
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        with:
          msystem: CLANGARM64
          update: false
          install: mingw-w64-clang-aarch64-clang
      - name: Use clangarm64 for cgo (Windows arm64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\clangarm64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "CC=clang" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: CPU features (x64)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          grep -m1 'model name' /proc/cpuinfo
          for f in avx avx2 fma avx512f avx512bw avx512vl; do
            grep -qw "$f" /proc/cpuinfo && echo "has $f" || echo "lacks $f"
          done
      # trendvidia/go-archive#81: give every run a cold, private build cache.
      #
      # This fork's VERSION is release-style (go1.26.5), so cmd/go keys
      # the build cache on the compiler's version STRING alone --
      # upstream's assumption that a released toolchain never changes.
      # Here the compiler and linker change on every commit while the
      # string does not, so a persistent GOCACHE on a self-hosted runner
      # can serve std package archives built by a PREVIOUS commit's
      # toolchain, and a change to compiler or linker output for std --
      # exactly the work this repo is made of -- gets judged green
      # against objects it never produced. `-count=1` does not help: it
      # defeats test-result caching, not the package cache.
      #
      # A private directory per run rather than `go clean -cache` on the
      # shared one: these runners host several jobs each, and wiping a
      # shared cache mid-run has been observed pruning a concurrent
      # job's entries out from under it.
      #
      # Set here rather than in a job-level `env:` because the value
      # needs RUNNER_TEMP, and the `runner` context is not available to
      # `jobs.<id>.env` -- a workflow that tries is rejected outright,
      # with zero jobs scheduled.
      #
      # The cold start is asserted, not assumed: the done-when accepts
      # "provably starts from an empty GOCACHE", and a guarantee nothing
      # checks is one that quietly stops holding.
      - name: Use a cold, per-run build cache (Unix)
        if: runner.os != 'Windows'
        run: |
          cache="$RUNNER_TEMP/gocache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -e "$cache" ]; then
            echo "::error::$cache already exists: this run is not starting cold (trendvidia/go-archive#81)"
            exit 1
          fi
          echo "cold: $cache does not exist yet"
          echo "GOCACHE=$cache" >> "$GITHUB_ENV"

      - name: Use a cold, per-run build cache (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "cache=%RUNNER_TEMP%\gocache-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          if exist "%cache%" echo ::error::%cache% already exists - this run is not starting cold, see trendvidia/go-archive#81
          if exist "%cache%" exit /b 1
          echo cold: %cache% does not exist yet
          echo GOCACHE=%cache%>>"%GITHUB_ENV%"

      - name: all.bash (Unix)
        if: runner.os != 'Windows'
        working-directory: src
        run: |
          GOROOT_BOOTSTRAP="$(go env GOROOT)"
          export GOROOT_BOOTSTRAP
          ./all.bash

      # Windows: build the toolchain, then smoke-test a curated set of PURE core
      # stdlib packages with the freshly-built go (compile + link + run + test).
      # The list deliberately excludes packages whose tests need external tools
      # or specific OS config (trendvidia/go-archive#16): os/user (workgroup account resolution), os
      # (symlink privilege), and runtime (its runtime-gdb tests fail on an
      # incompatible mingw gdb). make.bat already validates the runtime compiles;
      # plugin-matrix.yml validates the fork's plugin runtime feature on all 5.
      #
      # internal/buildcfg is in the list on purpose: the Windows leg does not run
      # all.bat, so its TestDefaultCGOEnabledUnset pin (trendvidia/go-archive#9) would otherwise never
      # execute on windows/{amd64,arm64}, even though make.bat bakes
      # DefaultCGO_ENABLED from %CGO_ENABLED% exactly as make.bash does.
      #
      # goplus and goplus/internal/execmem are in the list for the same reason:
      # the fork's runtime API for generated code (#14) has Windows-only paths,
      # VirtualAlloc mapping among them, that nothing else runs on Windows.
      #
      # The build below deliberately does NOT unset CGO_ENABLED: this lane exists to
      # DETECT a runner whose environment exports it, the same way the Unix legs
      # do via all.bash. (release-binaries.yml unsets it instead -- there the goal
      # is a correct artifact, not detection.)
      - name: make.bat + core-stdlib smoke (Windows)
        if: runner.os == 'Windows'
        working-directory: src
        shell: cmd
        run: |
          for /f "delims=" %%i in ('go env GOROOT') do set "GOROOT_BOOTSTRAP=%%i"
          call make.bat || exit /b 1
          ..\bin\go.exe test -short -count=1 errors fmt strings strconv bytes sort math encoding/json regexp sync context internal/buildcfg goplus goplus/internal/execmem || exit /b 1

      # Confirm the toolchain we just built is the fork, not stock Go.
      - name: Assert the built toolchain is go-plus (Unix)
        if: runner.os != 'Windows'
        working-directory: src
        run: |
          ../bin/go version
          ../bin/go version | grep -q '(plus' || { echo "::error::built toolchain is not the go-plus fork"; exit 1; }
      - name: Assert the built toolchain is go-plus (Windows)
        if: runner.os == 'Windows'
        working-directory: src
        shell: powershell
        run: |
          ..\bin\go.exe version
          if (-not (..\bin\go.exe version | Select-String '\(plus')) { Write-Error 'built toolchain is not the go-plus fork'; exit 1 }
      # Drop this run's cache whatever the outcome, so per-run
      # directories do not accumulate on the runners' disks (trendvidia/go-archive#81).
      - name: Remove this run's build cache (Unix)
        if: always() && runner.os != 'Windows'
        run: test -n "$GOCACHE" && rm -rf "$GOCACHE" || true

      - name: Remove this run's build cache (Windows)
        if: always() && runner.os == 'Windows'
        shell: cmd
        run: if exist "%GOCACHE%" rmdir /s /q "%GOCACHE%"
